<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threads 防詐屏蔽</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif;
      font-size: 14px;
      background: #fff;
      color: #1a1a1a;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #e85d04, #f48c06);
      color: #fff;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 22px; line-height: 1; }
    .header-text { flex: 1; }
    .header-title { font-size: 15px; font-weight: 700; }
    .header-subtitle { font-size: 11px; opacity: 0.85; margin-top: 1px; }

    /* Main toggle */
    .main-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .main-toggle-label { font-weight: 600; }
    .main-toggle-sub { font-size: 11px; color: #888; margin-top: 2px; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 24px;
      cursor: pointer; transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #e85d04; }
    input:checked + .slider::before { transform: translateX(20px); }

    /* Stats */
    .stats {
      padding: 12px 16px;
      background: #fff8f0;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stats-number {
      font-size: 28px;
      font-weight: 800;
      color: #e85d04;
      line-height: 1;
      min-width: 36px;
    }
    .stats-label { font-size: 12px; color: #666; line-height: 1.4; }
    .stats-label strong { display: block; color: #333; font-size: 13px; }

    /* Mode selector */
    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .mode-options { display: flex; gap: 8px; }
    .mode-btn {
      flex: 1;
      padding: 8px 4px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font-size: 12px;
      color: #555;
    }
    .mode-btn .mode-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    .mode-btn.active {
      border-color: #e85d04;
      background: #fff4ed;
      color: #e85d04;
      font-weight: 600;
    }
    .mode-btn:hover:not(.active) { border-color: #ccc; background: #fafafa; }

    /* Footer */
    .footer {
      padding: 10px 16px;
      font-size: 10px;
      color: #bbb;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🛡️</div>
    <div class="header-text">
      <div class="header-title">Threads 防詐屏蔽</div>
      <div class="header-subtitle">台灣政府防詐協作計畫</div>
    </div>
  </div>

  <div class="main-toggle">
    <div>
      <div class="main-toggle-label">啟用屏蔽</div>
      <div class="main-toggle-sub">掃描並處理詐騙貼文</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabledToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats">
    <div class="stats-number" id="blockedCount">0</div>
    <div class="stats-label">
      <strong>本頁已屏蔽貼文</strong>
      重整頁面後歸零
    </div>
  </div>

  <div class="section">
    <div class="section-title">屏蔽方式</div>
    <div class="mode-options">
      <button class="mode-btn" data-mode="hide">
        <span class="mode-icon">🚫</span>
        直接隱藏
      </button>
      <button class="mode-btn" data-mode="warn">
        <span class="mode-icon">⚠️</span>
        顯示警告
      </button>
    </div>
  </div>

  <div class="footer">
    僅偵測公開貼文文字，不蒐集個人資料<br>
    Wistron Software × 數位部 防詐協作計畫
  </div>

  <script src="popup.js"></script>
</body>
</html>
